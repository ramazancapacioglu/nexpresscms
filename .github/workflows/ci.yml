name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_DIALECT: sqlite
  SQLITE_URL: file:./data/ci.db
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-1234

jobs:
  verify:
    name: Tip kontrolü, testler, derleme, bütçe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # sürüm package.json "packageManager" alanından okunur
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tip kontrolü (tüm paketler)
        run: pnpm typecheck
      - name: Testler (SQLite)
        run: pnpm test
      - name: Üretim derlemesi
        run: pnpm --filter @nexpress/cms build
      - name: Ziyaretçi JS bütçesi
        run: pnpm --filter @nexpress/cms budget

  a11y:
    name: Erişilebilirlik ve duyarlılık taraması (axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Bu işe özel: üretim kipinde başlatıldığı için güçlü sır ve politikaya uyan yönetici parolası gerekir
      DB_DIALECT: sqlite
      SQLITE_URL: file:${{ github.workspace }}/a11y.db
      MEDIA_DIR: ${{ github.workspace }}/a11y-media
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: a11y-job-7f3c9b2e4d8a1c6e5b0f9d3a2c4e6b8a
      ADMIN_DEFAULT_EMAIL: tarama@example.test
      ADMIN_DEFAULT_PASSWORD: Ci-A11y!Pass-2026-xQ7
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tarayıcı önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Chromium kurulumu
        run: pnpm --filter @nexpress/cms exec playwright-core install --with-deps chromium
      - name: Veritabanı göçü ve tohum veri
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Üretim derlemesi
        run: pnpm --filter @nexpress/cms build
      - name: Uygulamayı başlat
        run: |
          nohup pnpm --filter @nexpress/cms start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login > /dev/null && exit 0; sleep 2; done
          echo "Uygulama açılmadı"; cat server.log; exit 1
      - name: axe taraması (kritik/ciddi ihlal ve mobil taşma derlemeyi düşürür)
        env:
          A11Y_BASE_URL: http://localhost:3000
          A11Y_EMAIL: ${{ env.ADMIN_DEFAULT_EMAIL }}
          A11Y_PASSWORD: ${{ env.ADMIN_DEFAULT_PASSWORD }}
          A11Y_OUT: ${{ github.workspace }}/a11y-report.json
        run: pnpm --filter @nexpress/cms a11y
      - name: Kimlik akışları uçtan uca (davet, parola, 2FA)
        env:
          AUTH_E2E_BASE_URL: http://localhost:3000
          AUTH_E2E_EMAIL: ${{ env.ADMIN_DEFAULT_EMAIL }}
          AUTH_E2E_PASSWORD: ${{ env.ADMIN_DEFAULT_PASSWORD }}
        run: pnpm --filter @nexpress/cms auth:e2e
      - name: Rapor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-rapor
          path: |
            a11y-report.json
            server.log
          if-no-files-found: ignore

  pgvector:
    name: Arama dizini testleri (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexpress
          POSTGRES_PASSWORD: nexpress_ci
          POSTGRES_DB: nexpress_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexpress -d nexpress_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: RAG testleri pgvector üzerinde
        working-directory: packages/rag
        env:
          RAG_TEST_PG_URL: postgresql://nexpress:nexpress_ci@localhost:5432/nexpress_ci
        run: pnpm test
      - name: Veritabanı testleri PostgreSQL üzerinde (hesaplar, denetim, şema paritesi, göçler)
        working-directory: packages/database
        env:
          # Sunucu adresi: her test dosyası kendi geçici veritabanını açıp siler
          DB_TEST_PG_URL: postgresql://nexpress:nexpress_ci@localhost:5432/postgres
        run: pnpm test

  audit:
    name: Bağımlılık denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # uyarı verir, birleştirmeyi engellemez; ciddi bulgular elle ele alınır
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm audit --prod --audit-level=high

  deploy:
    name: ileriseo.com
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sunucuya aktar
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' '[38.210.77.230]:4383 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHt1vm+xU/W/Q0NgxuAoGx+vdmTghTfIRXMIMyJI8Nvf' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -p 4383 -o UserKnownHostsFile="$HOME/.ssh/known_hosts" root@38.210.77.230
