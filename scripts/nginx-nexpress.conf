# ==============================================================================
# NexPress CMS — Nginx Tersine Vekil (Reverse Proxy) Yapılandırma Şablonu
# Dosya Konumu: /etc/nginx/sites-available/nexpress.conf
# Etkinleştirme: sudo ln -s /etc/nginx/sites-available/nexpress.conf /etc/nginx/sites-enabled/
# SSL Kurulumu: sudo certbot --nginx -d alanadiniz.com -d www.alanadiniz.com
# ==============================================================================

# Üst akış (Upstream) - NexPress CMS Node.js süreci
upstream nexpress_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# www → apeks. Uygulama da aynı yönlendirmeyi yapar (NEXT_PUBLIC_APP_URL). Sertifika her iki ada yazılmalıdır.
server {
    listen 80;
    listen [::]:80;
    server_name www.alanadiniz.com;
    return 308 $scheme://alanadiniz.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name alanadiniz.com;

    # Yükleme boyutu sınırı (WordPress dışa aktarımları ve büyük medya dosyaları için 70MB)
    client_max_body_size 70M;

    # Gzip Sıkıştırma
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Statik Varlıklar Önbelleği (Next.js derlenmiş varlıkları)
    location /_next/static/ {
        proxy_pass http://nexpress_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Medya ve Görsel Dosyaları Önbelleği
    location /media/ {
        proxy_pass http://nexpress_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Ana Uygulama Tersine Vekili
    location / {
        proxy_pass http://nexpress_upstream;
        proxy_http_version 1.1;

        # WebSocket ve HMR başlıkları
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standart vekil başlıkları (Doğru IP ve Şema tespiti için zorunlu)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Zaman aşımı ayarları (Büyük dosya yükleme ve AI işlemler için)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# ------------------------------------------------------------------------------
# İSTEĞE BAĞLI: ziyaretçi HTML'i için nginx önbelleği (uygulamada PUBLIC_CACHE_SECONDS=60 gibi bir değer gerekir)
# Uygulama yalnızca "herkese aynı" yanıtı `Cache-Control: public, s-maxage=N` ile işaretler; oturum/onay/parola çerezi
# (`nx_*`) taşıyan istekler her zaman özeldir. Aşağıdaki kurallar savunma katmanıdır: çerezli istek önbelleği atlar.
#
# 1) `http { }` bloğuna (server dışına):
#      proxy_cache_path /var/cache/nginx/nexpress levels=1:2 keys_zone=nx_html:20m max_size=500m inactive=1h use_temp_path=off;
#      map $http_cookie $nx_skip_cache { default 0; ~*(^|;\s*)nx_ 1; }
#
# 2) `location / { }` bloğuna:
#      proxy_cache nx_html;
#      proxy_cache_key "$scheme$host$request_uri";
#      proxy_cache_bypass $nx_skip_cache;
#      proxy_no_cache $nx_skip_cache;
#      proxy_cache_lock on;
#      proxy_cache_background_update on;
#      proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
#      proxy_cache_valid 404 30s;
#      add_header X-Cache-Status $upstream_cache_status always;
# Uygulama 404 yanıtına da sayfa ile aynı s-maxage yazabilir. `proxy_cache_valid 404` yalnızca
# Cache-Control olmayan yanıtlarda geçerlidir; uzun PUBLIC_CACHE_SECONDS kullanıyorsanız 404'ler de o süre kalır.
#
# Doğrulama: `curl -sI https://alanadiniz.com/ | grep -i x-cache-status` (ikinci istekte HIT).
# ------------------------------------------------------------------------------
